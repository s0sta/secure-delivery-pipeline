# Secure delivery pipeline for shop-api
#   pull request : test → secret scan → SAST → IaC scan → build → image scan → SBOM   (nothing is pushed)
#   main         : the same, then push → sign (keyless) → attest SBOM + provenance → deploy to dev (GitOps)
#                  → open a pull request that promotes the same digest to prod (a human approves it)
name: ci

on:
  pull_request:
  push:
    branches: [main]
    paths-ignore: ["deploy/overlays/**", "docs/**", "**.md"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/${{ github.repository }}
  PYTHON_VERSION: "3.12"

jobs:
  test:
    name: Lint and unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with: { python-version: "${{ env.PYTHON_VERSION }}", cache: pip, cache-dependency-path: requirements-dev.txt }
      - run: pip install -r requirements-dev.txt
      - name: Lint (ruff, incl. bandit rules)
        run: ruff check app tests && ruff format --check app tests
      - name: Unit tests with coverage gate (90 %)
        run: pytest --cov=app --cov-report=xml --cov-report=term
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with: { name: coverage, path: coverage.xml, retention-days: 7 }

  secrets:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with: { fetch-depth: 0 }
      - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  sast:
    name: SAST (semgrep)
    runs-on: ubuntu-latest
    permissions: { contents: read, security-events: write }
    container: { image: semgrep/semgrep:1.95.0 }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - run: semgrep scan --config p/default --config p/python --config p/dockerfile --sarif --output semgrep.sarif --error --metrics off
      - uses: github/codeql-action/upload-sarif@4bfa242aa49c5f7c6770b98670d354a7dfac05f8 # v3.39.1
        if: always()
        with: { sarif_file: semgrep.sarif, category: semgrep }

  iac:
    name: IaC and manifest checks
    runs-on: ubuntu-latest
    permissions: { contents: read, security-events: write }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Trivy config scan (Dockerfile, Kubernetes)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with: { scan-type: config, scan-ref: ., severity: "HIGH,CRITICAL", exit-code: "1", format: table }
      - name: Render overlays and validate against the Kubernetes schema
        run: |
          mkdir -p "$HOME/bin" && export PATH="$HOME/bin:$PATH"
          curl -sSL https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz | tar xz -C "$HOME/bin" kubeconform
          for o in deploy/overlays/*/; do
            echo "== $o"
            kustomize build "$o" | kubeconform -strict -summary -kubernetes-version 1.31.0 -ignore-missing-schemas
          done

  build:
    name: Build, scan, SBOM, sign
    needs: [test, secrets, sast, iac]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write        # push to GHCR (main only)
      id-token: write        # keyless signing with the workflow identity
      attestations: write
      security-events: write
    outputs:
      digest: ${{ steps.push.outputs.digest }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.10.0
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=sha,format=long
            type=raw,value=main,enable=${{ github.ref == 'refs/heads/main' }}
      - name: Build (load locally for scanning)
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          load: true
          tags: shop-api:scan
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test the container
        run: |
          docker run -d --name smoke -p 8080:8080 --read-only --tmpfs /tmp --cap-drop ALL shop-api:scan
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:8080/health && break; sleep 1; done
          curl -fsS http://127.0.0.1:8080/ready
          docker rm -f smoke
      - name: Image scan (fail on fixable CRITICAL)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with: { image-ref: "shop-api:scan", severity: CRITICAL, ignore-unfixed: true, exit-code: "1", format: table }
      - name: Image scan report (SARIF, HIGH+)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with: { image-ref: "shop-api:scan", severity: "HIGH,CRITICAL", format: sarif, output: trivy-image.sarif }
      - uses: github/codeql-action/upload-sarif@4bfa242aa49c5f7c6770b98670d354a7dfac05f8 # v3.39.1
        with: { sarif_file: trivy-image.sarif, category: trivy-image }
      - name: SBOM (CycloneDX)
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with: { image: "shop-api:scan", format: cyclonedx-json, output-file: sbom.cdx.json, upload-artifact: true }

      # ---- main branch only: publish, sign, attest ----
      - if: github.ref == 'refs/heads/main'
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with: { registry: ghcr.io, username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}" }
      - if: github.ref == 'refs/heads/main'
        id: push
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          provenance: false
      - if: github.ref == 'refs/heads/main'
        uses: sigstore/cosign-installer@7e8b541eb2e61bf99390e1afd4be13a184e9ebc5 # v3.10.1
      - name: Sign the image and attach the SBOM (keyless)
        if: github.ref == 'refs/heads/main'
        env: { DIGEST: "${{ steps.push.outputs.digest }}" }
        run: |
          cosign sign --yes "${IMAGE}@${DIGEST}"
          cosign attest --yes --type cyclonedx --predicate sbom.cdx.json "${IMAGE}@${DIGEST}"
      - name: Build provenance (SLSA)
        if: github.ref == 'refs/heads/main'
        uses: actions/attest-build-provenance@ef244123eb79f2f7a7e75d99086184180e6d0018 # v1.4.4
        with: { subject-name: "${{ env.IMAGE }}", subject-digest: "${{ steps.push.outputs.digest }}", push-to-registry: true }

  deploy-dev:
    name: Deploy to dev (GitOps commit)
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment: dev
    permissions: { contents: write }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Pin dev to the new digest
        env: { DIGEST: "${{ needs.build.outputs.digest }}" }
        run: |
          cd deploy/overlays/dev
          kustomize edit set image "shop-api=${IMAGE}@${DIGEST}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "deploy(dev): shop-api ${DIGEST:7:12}" && git push
        # Argo CD watches deploy/overlays/dev and syncs the cluster by itself.

  promote-prod:
    name: Open the promotion pull request for prod
    if: github.ref == 'refs/heads/main'
    needs: [build, deploy-dev]
    runs-on: ubuntu-latest
    permissions: { contents: write, pull-requests: write }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - env: { DIGEST: "${{ needs.build.outputs.digest }}" }
        run: cd deploy/overlays/prod && kustomize edit set image "shop-api=${IMAGE}@${DIGEST}"
      - uses: peter-evans/create-pull-request@22a9089034f40e5a961c8808d113e2c98fb63676 # v7.0.11
        with:
          branch: promote/prod
          title: "Promote shop-api to prod"
          commit-message: "deploy(prod): promote shop-api ${{ needs.build.outputs.digest }}"
          body: |
            Promotes the digest that passed all checks and runs in dev:
            `${{ env.IMAGE }}@${{ needs.build.outputs.digest }}`
            Signed with cosign (keyless) and attested (SBOM, SLSA provenance). Merge = deploy to prod by Argo CD.
