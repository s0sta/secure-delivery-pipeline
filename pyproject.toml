[project]
name = "shop-api"
version = "1.0.0"
description = "A small API delivered through a secure, signed, GitOps pipeline"
requires-python = ">=3.12"
license = { text = "MIT" }

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "S", "UP", "SIM"]
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.coverage.report]
fail_under = 90
