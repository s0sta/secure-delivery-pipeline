apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: shop-dev
resources:
- namespace.yaml
- ../../base
patches:
- patch: |-
    - op: replace
      path: /spec/replicas
      value: 1
    - op: replace
      path: /spec/template/spec/containers/0/env/0/value
      value: dev
  target:
    kind: Deployment
    name: shop-api
- patch: |-
    - op: replace
      path: /spec/minReplicas
      value: 1
  target:
    kind: HorizontalPodAutoscaler
    name: shop-api
- patch: |-
    - op: replace
      path: /spec/minAvailable
      value: 0
  target:
    kind: PodDisruptionBudget
    name: shop-api
images:
- digest: sha256:20d39f7714cf85a80c4ae4892c3cf7f8efec8e4b607749226235b86b052c7e23
  name: shop-api
  newName: ghcr.io/s0sta/secure-delivery-pipeline
