apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: shop-dev
resources:
  - namespace.yaml
  - ../../base
patches:
  - target: { kind: Deployment, name: shop-api }
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 1
      - op: replace
        path: /spec/template/spec/containers/0/env/0/value
        value: dev
  - target: { kind: HorizontalPodAutoscaler, name: shop-api }
    patch: |-
      - op: replace
        path: /spec/minReplicas
        value: 1
  - target: { kind: PodDisruptionBudget, name: shop-api }
    patch: |-
      - op: replace
        path: /spec/minAvailable
        value: 0
images:
  - name: shop-api
    newName: ghcr.io/s0sta/secure-delivery-pipeline
    newTag: "1.0.0"
