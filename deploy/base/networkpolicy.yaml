# Default deny for the namespace, then allow only what the API needs.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny
  namespace: shop
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: shop-api-allow
  namespace: shop
spec:
  podSelector:
    matchLabels: { app.kubernetes.io/name: shop-api }
  policyTypes: [Ingress, Egress]
  ingress:
    - from:   # the ingress controller
        - namespaceSelector:
            matchLabels: { kubernetes.io/metadata.name: ingress-nginx }
      ports: [{ port: 8080, protocol: TCP }]
    - from:   # Prometheus scraping /metrics
        - namespaceSelector:
            matchLabels: { kubernetes.io/metadata.name: monitoring }
      ports: [{ port: 8080, protocol: TCP }]
  egress:
    - to:     # DNS only
        - namespaceSelector:
            matchLabels: { kubernetes.io/metadata.name: kube-system }
          podSelector:
            matchLabels: { k8s-app: kube-dns }
      ports:
        - { port: 53, protocol: UDP }
        - { port: 53, protocol: TCP }
